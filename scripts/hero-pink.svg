<svg width="1150" height="300" viewBox="0 0 1150 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowTL" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ff5ea8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5ea8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0710"/>
      <stop offset="100%" stop-color="#120a14"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="180" cy="150" r="62"/>
    </clipPath>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0f1a"/>
      <stop offset="100%" stop-color="#1a0f1a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1150" height="300" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1150" height="300" rx="26" fill="url(#glowTL)"/>
  <rect x="0" y="0" width="1150" height="300" rx="26" fill="url(#glowBR)"/>
  <rect x="6" y="6" width="1138" height="288" rx="22" fill="none" stroke="#f472b6" stroke-opacity="0.55" stroke-width="2"/>

  <!-- status dot -->
  <circle cx="1090" cy="45" r="6" fill="#f9a8d4"/>

  <!-- avatar -->
  <circle cx="180" cy="150" r="65" fill="none" stroke="#f472b6" stroke-width="3"/>
  <image href="https://avatars.githubusercontent.com/u/187305823?u=b5fd20eab0be7fce888d998e454907649ea15b1a&amp;v=4"
         x="118" y="88" width="124" height="124" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- handle -->
  <text x="258" y="105" font-family="Verdana, Geneva, sans-serif" font-size="15" letter-spacing="3"
        fill="#f9a8d4" font-weight="bold">@engr-julia</text>
  <path d="M 258 118 Q 400 95 545 112" stroke="#f9a8d4" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>

  <!-- name -->
  <text x="255" y="168" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#f4eef6">Julia Rodrigo</text>

  <!-- tagline -->
  <text x="258" y="204" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#d8b8cf">Big dreams. ✈️ 💖</text>

  <!-- badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#f9d5e9">
    <rect x="255" y="218" width="140" height="38" rx="19" fill="url(#pillFill)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="275" y="242">TypeScript</text>

    <rect x="410" y="218" width="105" height="38" rx="19" fill="url(#pillFill)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="432" y="242">Blade</text>

    <rect x="530" y="218" width="95" height="38" rx="19" fill="url(#pillFill)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="553" y="242">PHP</text>

    <rect x="640" y="218" width="100" height="38" rx="19" fill="url(#pillFill)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="663" y="242">Java</text>
  </g>

  <!-- stars -->
  <text x="1010" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#f472b6">2</text>
  <text x="1010" y="182" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" letter-spacing="2" fill="#d8b8cf">TOTAL STARS</text>
</svg>
